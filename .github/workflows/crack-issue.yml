name: 🔐 Password Audit

# Triggers whenever a new issue is opened whose title is exactly "crack".
# The issue body should contain the password (phrase) to audit, optionally
# followed by flag lines such as --hash=sha512crypt or --time=60.
on:
  issues:
    types: [opened]

permissions:
  issues: write   # needed to post comments, update, and close the issue

jobs:
  audit:
    name: Audit password from issue
    # Only run when the issue title is exactly "crack" (case-sensitive)
    if: github.event.issue.title == 'crack'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── 0. Acknowledge the issue ──────────────────────────────────────────
      - name: Add 👀 reaction to acknowledge
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            await github.rest.reactions.createForIssue({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
              content: 'eyes',
            });

      # ── 1. Parse issue body ───────────────────────────────────────────────
      - name: Parse options and mask password
        id: opts
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          PASSWORD=$(printf '%s' "$BODY" \
            | grep -v '^[[:space:]]*--' \
            | grep -v '^[[:space:]]*$' \
            | head -1 \
            | tr -d '\r\n' \
            | cut -c1-256)

          echo "::add-mask::$PASSWORD"
          printf '%s' "$PASSWORD" > /tmp/password.txt

          HASH=$(printf '%s' "$BODY" | grep -oP '(?<=--hash=)\S+' | head -1 || true)
          TLIM=$(printf '%s' "$BODY" | grep -oP '(?<=--time=)\d+'  | head -1 || true)
          MODE=$(printf '%s' "$BODY" | grep -oP '(?<=--mode=)\S+' | head -1 || true)

          [ -z "$HASH" ] && HASH="sha512crypt"
          [ -z "$TLIM" ] && TLIM="30"
          [ -z "$MODE" ] && MODE="auto"

          if [ "$TLIM" -lt 10 ] 2>/dev/null; then TLIM=10; fi
          if [ "$TLIM" -gt 120 ] 2>/dev/null; then TLIM=120; fi

          case "$HASH" in
            sha512|sha512crypt) JOHN_FMT="crypt"; SSL_OPT="-6" ;;
            sha256|sha256crypt) JOHN_FMT="crypt"; SSL_OPT="-5" ;;
            md5|md5crypt)       JOHN_FMT="crypt"; SSL_OPT="-1" ;;
            *)
              HASH="sha512crypt"
              JOHN_FMT="crypt"
              SSL_OPT="-6"
              ;;
          esac

          case "$MODE" in
            auto|wordlist|incremental|single) ;;
            *) MODE="auto" ;;
          esac

          echo "hash=$HASH"         >> "$GITHUB_OUTPUT"
          echo "john_fmt=$JOHN_FMT" >> "$GITHUB_OUTPUT"
          echo "ssl_opt=$SSL_OPT"   >> "$GITHUB_OUTPUT"
          echo "time=$TLIM"         >> "$GITHUB_OUTPUT"
          echo "mode=$MODE"         >> "$GITHUB_OUTPUT"

          if [ -z "$PASSWORD" ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
          fi

      # ── 2. Handle empty body ──────────────────────────────────────────────
      - name: Post error on empty body
        if: steps.opts.outputs.empty == 'true'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '## ❌ No password provided',
                '',
                `Hi @${context.payload.issue.user.login}! It looks like the issue body is empty.`,
                '',
                'Please open a **new issue** with:',
                '- **Title:** `crack`',
                '- **Body:** the password you want to audit (one per line), e.g.:',
                '  ```',
                '  MySecretP@ss1!',
                '  ```',
                '',
                `> 📖 See the [usage guide](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/index.html) for all available flags.`,
              ].join('\n'),
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
            });

      - name: Stop if empty body
        if: steps.opts.outputs.empty == 'true'
        run: exit 0

      # ── 3. Analyse password complexity and security ───────────────────────
      - name: Analyse password complexity and security
        id: stats
        run: |
          python3 - << 'PYEOF'
          import re, math, os, json

          with open('/tmp/password.txt') as f:
              p = f.read()

          n  = len(p)
          lo = bool(re.search(r'[a-z]', p))
          up = bool(re.search(r'[A-Z]', p))
          di = bool(re.search(r'\d',    p))
          sp = bool(re.search(r'[^A-Za-z0-9]', p))

          lo_count = len(re.findall(r'[a-z]', p))
          up_count = len(re.findall(r'[A-Z]', p))
          di_count = len(re.findall(r'\d', p))
          sp_count = len(re.findall(r'[^A-Za-z0-9]', p))

          pool = (26 * lo) + (26 * up) + (10 * di) + (33 * sp)
          ent  = round(n * math.log2(max(pool, 1)), 1)

          # Entropy-only grade (for explanation; NOT the final verdict alone)
          if   ent < 28:  ent_grade = "Very Weak"
          elif ent < 36:  ent_grade = "Weak"
          elif ent < 60:  ent_grade = "Moderate"
          elif ent < 128: ent_grade = "Strong"
          else:           ent_grade = "Very Strong"

          # ── Comprehensive insecurity checks ─────────────────────────────
          issues = []

          # 1. Length checks
          if n < 8:
              issues.append(("Password is too short — under 8 characters. Minimum recommended length is 12.", "critical"))
          elif n < 12:
              issues.append(("Password length is below the recommended 12 characters.", "high"))

          # 2. Known common / bad passwords
          COMMON_PASSWORDS = {
              "password", "password1", "password12", "password123", "password1234",
              "password1!", "password1!!", "password!", "passw0rd", "p@ssword",
              "p@ssw0rd", "p@$$word", "pa$$w0rd", "p4ssword", "p4ssw0rd",
              "123456", "1234567", "12345678", "123456789", "1234567890",
              "12345", "1234", "123", "111111", "222222", "333333", "444444",
              "555555", "666666", "777777", "888888", "999999", "000000",
              "11111111", "00000000", "12121212", "1234512345",
              "qwerty", "qwerty1", "qwerty12", "qwerty123", "qwerty!",
              "qwertyuiop", "asdfgh", "asdfghjkl", "zxcvbn", "zxcvbnm",
              "1q2w3e", "1q2w3e4r", "1q2w3e4r5t", "qazwsx", "qazwsxedc",
              "qwerasdf", "asdfzxcv",
              "abc123", "abc1234", "abcdef", "abcd1234",
              "letmein", "letmein1", "letmein!", "letmein123",
              "monkey", "monkey1", "monkey123", "monkey!",
              "dragon", "dragon1", "dragon123",
              "baseball", "football", "soccer", "hockey", "basketball",
              "sunshine", "sunshine1", "sunshine123",
              "master", "master1", "master123",
              "hello", "hello123", "hello1", "hello!",
              "welcome", "welcome1", "welcome123",
              "shadow", "shadow1", "shadow123",
              "superman", "superman1", "superman123",
              "batman", "batman1", "batman123",
              "iloveyou", "iloveyou1", "iloveyou!",
              "trustno1", "trustno1!",
              "admin", "admin123", "admin1", "admin!", "administrator",
              "login", "login1", "login123",
              "princess", "princess1", "princess123",
              "starwars", "starwars1",
              "ninja", "ninja1", "ninja123",
              "pepper", "pepper1", "pepper123",
              "mustang", "mustang1",
              "flower", "flower1", "flower123",
              "michael", "michael1", "jessica", "jennifer",
              "charlie", "charlie1", "charlie123",
              "donald", "donald1", "thomas", "thomas1",
              "google", "google1", "apple1", "facebook",
              "matrix", "matrix1", "avatar", "avatar1",
              "hunter", "hunter1", "hunter2",
              "secret", "secret1", "secret123",
              "changeme", "changeme1", "changeme!",
              "temp", "temp123", "temp1234", "test", "test123", "test1234",
              "pass", "pass1", "pass123", "pass1234",
              "access", "access1", "access123",
              "maggie", "maggie1", "michael123",
              "summer", "summer1", "summer123",
              "winter", "winter1", "winter123",
              "spring", "spring1",
              "cheese", "cheese1", "cheese123",
              "butter", "butter1",
              "cookie", "cookie1", "cookie123",
              "coffee", "coffee1",
              "hockey1", "hockey123",
              "soccer1", "soccer123",
              "1password", "mypassword", "mypassword1",
          }

          p_lower = p.lower()
          p_stripped = p_lower.rstrip('0123456789!@#$%^&*_-.')

          if p_lower in COMMON_PASSWORDS:
              issues.append((
                  "Password is in the top common-passwords list — a cracker tries these first and will find it instantly.",
                  "critical"
              ))
          elif p_stripped in COMMON_PASSWORDS:
              issues.append((
                  "Password is a common word/phrase with only a simple numeric or symbol suffix — still instantly guessable.",
                  "critical"
              ))

          # 3. Leet-speak normalisation + dictionary-word check
          LEET_MAP = {'@': 'a', '3': 'e', '1': 'i', '0': 'o', '5': 's',
                      '7': 't', '$': 's', '!': 'i', '4': 'a', '8': 'b',
                      '6': 'g', '9': 'g', '+': 't'}

          def normalize_leet(s):
              return ''.join(LEET_MAP.get(c, c) for c in s.lower())

          normalized = normalize_leet(p)

          DICTIONARY_WORDS = [
              "password", "passw0rd", "admin", "administrator",
              "monkey", "dragon", "master", "hello", "welcome",
              "sunshine", "shadow", "superman", "batman",
              "football", "baseball", "soccer", "hockey", "basketball",
              "letmein", "trustno", "iloveyou", "princess", "starwars",
              "qwerty", "keyboard", "computer", "internet",
              "login", "access", "secret", "hunter", "ninja",
              "summer", "winter", "spring", "autumn", "flower",
              "january", "february", "march", "april", "june",
              "july", "august", "september", "october", "november", "december",
              "monday", "tuesday", "wednesday", "thursday", "friday", "saturday", "sunday",
              "chocolate", "michael", "jessica", "jennifer", "charlie",
              "thomas", "andrew", "robert", "william", "joseph", "donald",
              "superman", "batman", "pokemon", "nintendo",
              "google", "apple", "microsoft", "amazon", "facebook",
              "liverpool", "chelsea", "arsenal", "manchester",
              "maggie", "mustang", "pepper", "cheese", "butter", "coffee",
              "matrix", "avatar", "pirate",
              "cookie", "penguin", "silver", "golden", "purple",
              "test", "temp", "pass", "change", "default",
          ]

          already_flagged = any(
              msg.startswith("Password is in the top") or msg.startswith("Password is a common")
              for msg, _ in issues
          )

          leet_word_found = None
          dict_word_found = None
          if not already_flagged:
              for word in DICTIONARY_WORDS:
                  if word in p_lower and dict_word_found is None:
                      dict_word_found = word
                  if word in normalized and word not in p_lower and leet_word_found is None:
                      leet_word_found = word

          if dict_word_found:
              issues.append((
                  f'Contains a common dictionary word: "{dict_word_found}". Dictionary-based attacks will find this quickly.',
                  "high"
              ))
          if leet_word_found:
              issues.append((
                  f'Uses leet-speak substitution of the word "{leet_word_found}" (e.g. @ for a, 0 for o). Modern crackers normalise these automatically.',
                  "high"
              ))

          # 4. Keyboard walk detection
          KEYBOARD_WALKS = [
              "qwerty", "qwert", "werty", "erty", "rtyui",
              "asdfg", "asdf", "sdfg", "dfgh",
              "zxcvb", "zxcv", "xcvb",
              "qweasd", "asdzxc", "qazwsx",
              "1qaz", "2wsx", "3edc", "4rfv", "5tgb", "6yhn",
              "1q2w3e", "1q2w", "2w3e", "3e4r",
              "poiuy", "lkjhg", "mnbvc",
          ]
          for walk in KEYBOARD_WALKS:
              if walk in p_lower:
                  issues.append((
                      f'Contains a keyboard-walk pattern: "{walk}". These sequences are well-known to crackers.',
                      "high"
                  ))
                  break

          # 5. Repeated-character detection
          if re.search(r'(.)\1{3,}', p):
              issues.append(("Contains 4 or more identical consecutive characters (e.g. aaaa, 1111). Repetition drastically reduces real entropy.", "high"))
          elif re.search(r'(.)\1{2,}', p):
              issues.append(("Contains 3 identical consecutive characters (e.g. aaa, 111). Avoid repetition.", "medium"))

          # 6. Sequential-character patterns
          SEQUENCES = [
              "123456789", "12345678", "1234567", "123456", "12345", "1234",
              "234567", "345678", "456789", "567890",
              "987654321", "87654321", "7654321", "654321",
              "abcdefgh", "abcdefg", "abcdef", "abcde", "abcd",
              "hgfedcba", "gfedcba", "fedcba",
          ]
          for seq in SEQUENCES:
              if seq in p_lower:
                  issues.append((
                      f'Contains a sequential pattern: "{seq}". Sequential characters are among the first guessed by brute-force tools.',
                      "high"
                  ))
                  break

          # 7. Year / date patterns
          if re.search(r'(19|20)\d{2}', p):
              issues.append(("Contains a 4-digit year (e.g. 1990, 2023). Years are commonly appended and guessed early.", "medium"))
          if re.search(r'(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])', p):
              issues.append(("Contains what appears to be a date pattern (MMDD or DDMM). Avoid personally meaningful dates.", "medium"))

          # 8. All-numeric password
          if p.isdigit():
              issues.append(("Password consists entirely of digits — extremely vulnerable to brute force.", "critical"))

          # 9. Missing character classes
          if not up:
              issues.append(("No uppercase letters (A–Z). Adding uppercase expands the character pool significantly.", "medium"))
          if not sp:
              issues.append(("No special characters (!@#$…). Special characters significantly increase complexity.", "medium"))
          if not di:
              issues.append(("No digits (0–9). Adding numbers increases the character pool.", "low"))

          # 10. Word+number predictable pattern
          if re.search(r'^[A-Za-z@$!]+\d{1,4}[!@#$%]?$', p) and n < 16:
              issues.append(("Follows the predictable word + short-number (+ optional symbol) pattern — one of the most commonly guessed structures.", "medium"))

          # ── Determine overall security grade ──────────────────────────────
          critical_count = sum(1 for _, s in issues if s == "critical")
          high_count     = sum(1 for _, s in issues if s == "high")
          medium_count   = sum(1 for _, s in issues if s == "medium")
          low_count      = sum(1 for _, s in issues if s == "low")

          if critical_count > 0:
              pattern_grade = "Very Weak"
          elif high_count >= 1:
              pattern_grade = "Weak"
          elif medium_count >= 3:
              pattern_grade = "Moderate"
          elif medium_count >= 1 or low_count >= 2:
              pattern_grade = "Moderate"
          else:
              pattern_grade = ent_grade

          GRADE_RANK = {"Very Weak": 0, "Weak": 1, "Moderate": 2, "Strong": 3, "Very Strong": 4}
          final_grade = min([ent_grade, pattern_grade], key=lambda g: GRADE_RANK[g])

          # ── Write outputs ────────────────────────────────────────────────
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"len={n}\n")
              out.write(f"lo={'t' if lo else 'f'}\n")
              out.write(f"up={'t' if up else 'f'}\n")
              out.write(f"di={'t' if di else 'f'}\n")
              out.write(f"sp={'t' if sp else 'f'}\n")
              out.write(f"lo_count={lo_count}\n")
              out.write(f"up_count={up_count}\n")
              out.write(f"di_count={di_count}\n")
              out.write(f"sp_count={sp_count}\n")
              out.write(f"pool={pool}\n")
              out.write(f"ent={ent}\n")
              out.write(f"ent_grade={ent_grade}\n")
              out.write(f"grade={final_grade}\n")
              out.write(f"issue_count={len(issues)}\n")
              out.write(f"critical_count={critical_count}\n")
              out.write(f"high_count={high_count}\n")
              out.write(f"medium_count={medium_count}\n")
              out.write(f"low_count={low_count}\n")

          with open('/tmp/issues.json', 'w') as f:
              json.dump(issues, f)
          PYEOF

      # ── 4. Cache John the Ripper ──────────────────────────────────────────
      # Caches the john binary and word-list data so reinstallation is skipped
      # on subsequent runs, saving ~30–60 s per audit.
      - name: Cache John the Ripper
        id: cache-john
        uses: actions/cache@v4
        with:
          path: |
            /usr/sbin/john
            /usr/share/john
          key: john-${{ runner.os }}-apt-v1

      # ── 5. Install John the Ripper (only on cache miss) ───────────────────
      - name: Install John the Ripper
        if: steps.cache-john.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends john

      # ── 6. Create password hash ───────────────────────────────────────────
      - name: Create password hash
        env:
          SSL_OPT: ${{ steps.opts.outputs.ssl_opt }}
        run: |
          HASH=$(openssl passwd "$SSL_OPT" -stdin < /tmp/password.txt)
          printf 'audit:%s\n' "$HASH" > /tmp/hash.txt

      # ── 7. Run John the Ripper ────────────────────────────────────────────
      - name: Run John the Ripper audit
        id: john
        env:
          JOHN_FMT: ${{ steps.opts.outputs.john_fmt }}
          TLIM:     ${{ steps.opts.outputs.time }}
          MODE:     ${{ steps.opts.outputs.mode }}
        run: |
          START=$(date +%s%3N)
          CRACKED=false
          CRACK_METHOD="Not cracked within time limit"
          HALF=$(( TLIM / 2 ))

          do_john() {
            timeout "$1" john --format="$JOHN_FMT" $2 /tmp/hash.txt 2>&1 || true
          }

          is_cracked() {
            john --show --format="$JOHN_FMT" /tmp/hash.txt 2>&1 \
              | grep -c "1 password hash cracked" || true
          }

          case "$MODE" in
            wordlist)
              do_john "$TLIM" "--wordlist=/usr/share/john/password.lst"
              ;;
            incremental)
              do_john "$TLIM" "--incremental"
              ;;
            single)
              do_john "$TLIM" "--single"
              ;;
            auto|*)
              do_john "$HALF" "--wordlist=/usr/share/john/password.lst"
              if [ "$(is_cracked)" -eq 0 ]; then
                do_john "$HALF" "--incremental"
              fi
              ;;
          esac

          END=$(date +%s%3N)
          TOTAL_MS=$(( END - START ))

          SHOW=$(john --show --format="$JOHN_FMT" /tmp/hash.txt 2>&1 || true)
          if echo "$SHOW" | grep -q "1 password hash cracked"; then
            CRACKED=true
            CRACK_METHOD="Cracked by John the Ripper"
          fi

          BENCH=$(timeout 10 john --test=3 --format="$JOHN_FMT" 2>&1 \
            | grep -oP '\d+ c/s' | tail -1 || echo "N/A")

          echo "cracked=$CRACKED"       >> "$GITHUB_OUTPUT"
          echo "method=$CRACK_METHOD"   >> "$GITHUB_OUTPUT"
          echo "total_ms=$TOTAL_MS"     >> "$GITHUB_OUTPUT"
          echo "bench=$BENCH"           >> "$GITHUB_OUTPUT"

      # ── 8. Post report and close issue ───────────────────────────────────
      - name: Post audit report and close issue
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          LEN:            ${{ steps.stats.outputs.len }}
          LO:             ${{ steps.stats.outputs.lo }}
          UP:             ${{ steps.stats.outputs.up }}
          DI:             ${{ steps.stats.outputs.di }}
          SP:             ${{ steps.stats.outputs.sp }}
          LO_COUNT:       ${{ steps.stats.outputs.lo_count }}
          UP_COUNT:       ${{ steps.stats.outputs.up_count }}
          DI_COUNT:       ${{ steps.stats.outputs.di_count }}
          SP_COUNT:       ${{ steps.stats.outputs.sp_count }}
          POOL:           ${{ steps.stats.outputs.pool }}
          ENT:            ${{ steps.stats.outputs.ent }}
          ENT_GRADE:      ${{ steps.stats.outputs.ent_grade }}
          GRADE:          ${{ steps.stats.outputs.grade }}
          ISSUE_COUNT:    ${{ steps.stats.outputs.issue_count }}
          CRITICAL_COUNT: ${{ steps.stats.outputs.critical_count }}
          HIGH_COUNT:     ${{ steps.stats.outputs.high_count }}
          MEDIUM_COUNT:   ${{ steps.stats.outputs.medium_count }}
          LOW_COUNT:      ${{ steps.stats.outputs.low_count }}
          CRACKED:        ${{ steps.john.outputs.cracked }}
          METHOD:         ${{ steps.john.outputs.method }}
          TOTAL_MS:       ${{ steps.john.outputs.total_ms }}
          BENCH:          ${{ steps.john.outputs.bench }}
          HASH:           ${{ steps.opts.outputs.hash }}
          TLIM:           ${{ steps.opts.outputs.time }}
          MODE:           ${{ steps.opts.outputs.mode }}
        with:
          script: |
            const fs = require('fs');

            const ent       = parseFloat(process.env.ENT)  || 0;
            const len       = parseInt(process.env.LEN)    || 0;
            const grade     = process.env.GRADE;
            const entGrade  = process.env.ENT_GRADE;
            const cracked   = process.env.CRACKED === 'true';
            const totalSec  = (parseInt(process.env.TOTAL_MS) / 1000).toFixed(1);
            const bench     = process.env.BENCH || 'N/A';
            const issueCount    = parseInt(process.env.ISSUE_COUNT)    || 0;
            const criticalCount = parseInt(process.env.CRITICAL_COUNT) || 0;
            const highCount     = parseInt(process.env.HIGH_COUNT)     || 0;
            const mediumCount   = parseInt(process.env.MEDIUM_COUNT)   || 0;
            const lowCount      = parseInt(process.env.LOW_COUNT)      || 0;

            let securityIssues = [];
            try {
              securityIssues = JSON.parse(fs.readFileSync('/tmp/issues.json', 'utf8'));
            } catch (_) {}

            const gradeEmoji = {
              'Very Weak':   '🔴',
              'Weak':        '🟠',
              'Moderate':    '🟡',
              'Strong':      '🟢',
              'Very Strong': '💪',
            };
            const emoji    = gradeEmoji[grade]    || '⚪';
            const entEmoji = gradeEmoji[entGrade] || '⚪';

            const filled = Math.round(Math.min(ent / 128, 1) * 20);
            const bar    = '█'.repeat(filled) + '░'.repeat(20 - filled);

            const b = v => v === 't' ? '✅' : '❌';
            const classRows = [
              `| Lowercase letters \`a–z\`    | ${b(process.env.LO)} | ${process.env.LO_COUNT} |`,
              `| Uppercase letters \`A–Z\`    | ${b(process.env.UP)} | ${process.env.UP_COUNT} |`,
              `| Digits \`0–9\`               | ${b(process.env.DI)} | ${process.env.DI_COUNT} |`,
              `| Special characters \`!@#$…\` | ${b(process.env.SP)} | ${process.env.SP_COUNT} |`,
            ].join('\n');

            const sevEmoji = { critical: '🔴', high: '🟠', medium: '🟡', low: '🔵' };
            let issuesSection = '';
            if (securityIssues.length === 0) {
              issuesSection = `\n> ✅ No known bad-password patterns were detected.\n`;
            } else {
              const rows = securityIssues.map(([desc, sev], i) =>
                `| ${i + 1} | ${desc} | ${sevEmoji[sev] || '⚪'} ${sev.toUpperCase()} |`
              ).join('\n');
              issuesSection = [
                ``,
                `| # | Issue | Severity |`,
                `|---|---|---|`,
                rows,
              ].join('\n');
            }

            const tips = [
              ``,
              `- ✅ **Use a passphrase**: Four or more random, unrelated words (e.g. \`correct-horse-battery-staple\`) are both memorable and highly secure (80+ bits of entropy).`,
              `- ✅ **Aim for 16+ characters** — length matters more than complexity.`,
              `- ✅ **Mix character classes**: include uppercase, lowercase, digits, and symbols in unexpected positions — not just at the end.`,
              `- ❌ **Never use dictionary words**, even with substitutions. Modern crackers normalise leet-speak (@ → a, 0 → o) automatically.`,
              `- ❌ **Avoid predictable patterns**: no keyboard walks (qwerty), no sequential numbers (12345), no years or dates.`,
              `- ❌ **Avoid "word + number" suffixes** like \`password1\` or \`dragon99\` — these are the first things tried.`,
              `- ✅ **Use a password manager** (Bitwarden, 1Password, KeePass) to generate and store truly random, unique passwords for every account.`,
              `- ✅ **Enable MFA** wherever possible — even a cracked password cannot be used without the second factor.`,
            ].join('\n');

            const comment = [
              `## 🔐 Password Audit Results`,
              ``,
              `Hi @${context.payload.issue.user.login}! Your password audit is complete. Here is a full breakdown of the results.`,
              ``,
              `---`,
              ``,
              `### 📊 Audit Statistics`,
              ``,
              `| Property | Value |`,
              `|---|---|`,
              `| **Password length** | \`${len}\` characters |`,
              `| **Character pool size** | \`${process.env.POOL}\` possible characters |`,
              `| **Shannon entropy** | \`${ent}\` bits |`,
              `| **Hash format used** | \`${process.env.HASH}\` |`,
              `| **Audit mode** | \`${process.env.MODE}\` |`,
              `| **Time limit** | \`${process.env.TLIM}s\` |`,
              `| **Total audit time** | \`${totalSec}s\` |`,
              `| **Hardware speed (benchmark)** | \`${bench}\` |`,
              ``,
              `---`,
              ``,
              `### 🔡 Character Composition`,
              ``,
              `| Class | Present | Count |`,
              `|---|---|---|`,
              classRows,
              ``,
              `---`,
              ``,
              `### 🔢 What Is Entropy? (Plain English Explanation)`,
              ``,
              `**Entropy** is a measure of how many possible combinations an attacker would need to try before guessing your password. Think of it like the size of a haystack — the larger the haystack, the longer it takes to find the needle.`,
              ``,
              `> **Key formula:** \`entropy = length × log₂(character pool size)\``,
              `>`,
              `> With a pool of **${process.env.POOL}** characters and a length of **${len}**, this password has **${ent} bits** of theoretical entropy — meaning roughly **2^${ent}** possible combinations if the password were chosen *randomly*.`,
              ``,
              `⚠️ **Important caveat:** High entropy is necessary but *not sufficient* for a secure password. If a password appears in a wordlist or follows a predictable pattern (like \`password1!\`), a cracker finds it *instantly* — regardless of what the entropy formula says. That is why this audit also runs pattern-based checks (see below).`,
              ``,
              `\`\`\``,
              `Entropy scale — how hard is it to guess a truly random password of this size?`,
              ``,
              `[${bar}] ${ent} / 128 bits`,
              ``,
              `  🔴 Very Weak   < 28 bits   — guessed in milliseconds (e.g. "cat", "abc")`,
              `  🟠 Weak        28–36 bits  — guessed in seconds      (e.g. "hello12")`,
              `  🟡 Moderate    36–60 bits  — guessed in minutes/hours (e.g. "Tr0ub4d0r")`,
              `  🟢 Strong      60–128 bits — would take years on modern hardware`,
              `  💪 Very Strong 128+ bits   — effectively uncrackable by brute force`,
              `\`\`\``,
              ``,
              `| Metric | Result |`,
              `|---|---|`,
              `| **Entropy-based grade** | ${entEmoji} ${entGrade} (${ent} bits) |`,
              ``,
              `---`,
              ``,
              `### 🚨 Security Pattern Analysis`,
              ``,
              `The following checks were run to detect known-bad patterns, common dictionary words, keyboard walks, leet-speak substitutions, and other predictable structures that make a password easy to crack even when its entropy looks acceptable.`,
              issuesSection,
              ``,
              `| Severity | Count | Meaning |`,
              `|---|---|---|`,
              `| 🔴 Critical | ${criticalCount} | Password will be cracked almost instantly |`,
              `| 🟠 High | ${highCount} | Significantly weakens the password |`,
              `| 🟡 Medium | ${mediumCount} | Reduces security, should be addressed |`,
              `| 🔵 Low | ${lowCount} | Minor improvement opportunity |`,
              ``,
              `---`,
              ``,
              `### 💪 Overall Verdict`,
              ``,
              `> The **overall grade** is the *worst* of the entropy grade and the pattern-analysis grade. A password that scores well on entropy but matches a known bad pattern is still rated poorly — because a cracker would find it regardless of the theoretical entropy.`,
              ``,
              `| Metric | Result |`,
              `|---|---|`,
              `| **Entropy grade** | ${entEmoji} ${entGrade} (theoretical) |`,
              `| **Overall security grade** | ${emoji} **${grade}** |`,
              `| **Cracked by John the Ripper** | ${cracked ? '💀 **Yes — password was found during the audit**' : '✅ Not cracked within the time limit'} |`,
              `| **Crack method** | ${process.env.METHOD} |`,
              ``,
              `---`,
              ``,
              `### 💡 How to Create a Stronger Password`,
              tips,
              ``,
              `---`,
              ``,
              `> ⚠️ **Privacy reminder:** Never share real passwords publicly.`,
              `> This tool is for **educational purposes only**. Use a fictional`,
              `> or already-changed password when testing.`,
              `>`,
              `> 📖 See the [usage guide](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/index.html) for available flags and examples.`,
              ``,
              `*Audit powered by [John the Ripper](https://www.openwall.com/john/) · ${new Date().toUTCString()}*`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
              body: comment,
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
              body:  '[Password redacted after audit completed]',
              state: 'closed',
            });

      # ── 9. Report workflow failures as a new issue ────────────────────────
      - name: Open failure-report issue
        if: failure()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          TRIGGER_ISSUE: ${{ github.event.issue.number }}
          RUN_URL:       ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const runUrl      = process.env.RUN_URL;
            const triggerNum  = process.env.TRIGGER_ISSUE;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `🚨 Password Audit workflow failed (triggered by #${triggerNum})`,
              body: [
                `## ⚠️ Workflow Failure Detected`,
                ``,
                `@unaveragetech — a step in the **🔐 Password Audit** workflow failed`,
                `and requires your attention.`,
                ``,
                `| Field | Value |`,
                `|---|---|`,
                `| **Triggering issue** | #${triggerNum} |`,
                `| **Workflow run** | [View logs](${runUrl}) |`,
                `| **Repository** | \`${context.repo.owner}/${context.repo.repo}\` |`,
                `| **Timestamp** | ${new Date().toUTCString()} |`,
                ``,
                `### Next Steps`,
                `1. Open the [workflow run](${runUrl}) and expand the failed step.`,
                `2. Review the error output and fix the underlying cause.`,
                `3. Close this issue once the problem is resolved.`,
                ``,
                `*This issue was opened automatically by the audit workflow.*`,
              ].join('\n'),
              labels: ['bug'],
            });
